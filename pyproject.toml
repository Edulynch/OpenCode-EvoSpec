[project]
name = "evospec"
version = "0.5.0"
description = "EvoSpec workflow authority and OpenCode integration"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
evospec = "evospec.cli:main"
evospec-agent = "evospec.agent_protocol:main"
evospec-agent-protocol = "evospec.agent_protocol:main"

[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
evospec = ["resources/opencode/**/*", "resources/dashboard/**/*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["evospec"]
namespaces = false

[tool.unittest]
start-directory = "tests"

[tool.basedpyright]
failOnWarnings = false
