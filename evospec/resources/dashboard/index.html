<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="A read-only, canonical project context dashboard.">
    <title>EvoSpec Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c8cff'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='system-ui,sans-serif' font-size='36' font-weight='700' fill='%230d1018'%3EE%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>
    <a class="skip-link" href="#dashboard-main">Skip to project context</a>
    <header class="site-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">E</span>
        <div>
          <p class="eyebrow">Read-only dashboard</p>
          <h1>EvoSpec</h1>
        </div>
      </div>
      <div class="header-status">
        <p id="load-status" class="load-status" role="status">Connecting</p>
        <p id="project-summary" class="project-summary">Loading the current project status.</p>
      </div>
    </header>

    <main id="dashboard-main" tabindex="-1">
      <section id="current-work-section" class="operational-section current-work-section" aria-labelledby="current-work-heading" hidden>
        <div class="section-heading">
          <p class="eyebrow">Happening now</p>
          <h2 id="current-work-heading">Current work</h2>
        </div>
        <div class="current-work-summary">
          <div>
            <strong id="current-work-title">Active work</strong>
            <p id="current-work-explanation">No current work is recorded.</p>
          </div>
          <span id="current-work-status" class="status-label">In progress</span>
        </div>
      </section>

      <section id="blocked-section" class="operational-section blocked-section" aria-labelledby="blocked-heading" aria-live="polite" hidden>
        <div class="section-heading">
          <p class="eyebrow">Needs attention</p>
          <h2 id="blocked-heading">Blocked work</h2>
        </div>
        <div id="blocked-list" class="blocked-list"></div>
      </section>

      <section class="dashboard-tabs" aria-label="Dashboard detail views">
        <div class="dashboard-tablist" role="tablist" aria-label="Dashboard details">
          <button id="tab-features" class="dashboard-tab" type="button" role="tab" aria-selected="true" aria-controls="features-panel" tabindex="0">Features</button>
          <button id="tab-technical" class="dashboard-tab" type="button" role="tab" aria-selected="false" aria-controls="technical-panel" tabindex="-1">Technical details</button>
        </div>

        <section id="features-panel" class="features-section" role="tabpanel" aria-labelledby="tab-features">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Features</p>
              <h2 id="features-heading">Published features</h2>
            </div>
          </div>
          <div id="feature-filters" class="feature-filters" role="group" aria-label="Filter features by status">
            <button id="feature-filter-all" class="feature-filter" type="button" data-feature-filter="all" aria-pressed="true">All</button>
            <button id="feature-filter-completed" class="feature-filter" type="button" data-feature-filter="completed" aria-pressed="false">Completed</button>
            <button id="feature-filter-blocked" class="feature-filter" type="button" data-feature-filter="blocked" aria-pressed="false">Blocked</button>
          </div>
          <div id="features-list" class="feature-list"></div>
        </section>

        <section id="technical-panel" class="technical-panel" role="tabpanel" aria-labelledby="tab-technical" hidden>
          <div id="technical-content" class="technical-content"></div>
        </section>
      </section>
    </main>
    <script src="dashboard.js"></script>
  </body>
</html>
